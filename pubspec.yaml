name: api_managers
description: "Professional cross-platform API testing application - Postman alternative"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP Client
  dio: ^5.8.0+1

  # Local Storage
  hive_flutter: ^1.1.0

  # Utilities
  equatable: ^2.0.7
  uuid: ^4.5.1
  intl: ^0.19.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  mime: ^2.0.0
  url_launcher: ^6.3.1

  # Desktop window management
  window_manager: ^0.4.3

  # UI & Theming
  flex_color_scheme: ^8.2.0
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  msix: ^3.16.8

flutter:
  uses-material-design: true

# ─── Windows MSIX Installer Configuration ────────────────────────────────────
msix_config:
  display_name: API Managers
  publisher_display_name: Dishant
  identity_name: com.dishant.apimanagers
  msix_version: 1.0.0.0
  description: Professional API testing tool — build, test and manage HTTP requests
  logo_path: windows\runner\resources\app_icon.ico
  capabilities: internetClient, privateNetworkClientServer
  output_name: APIManagers-Setup
  output_path: installer
  publisher: CN=dishant-chudasama.com
  store: false
  sign_msix: false
